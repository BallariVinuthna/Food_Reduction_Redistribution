server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: smart-food-redistribution
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/food_redistribution_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:yY6ivv3fvUAfs6p4LBwHGmsJKwW4YBg8PEhBaQWlnTg=}
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 604800000 # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  email:
    resend-api-key: ${RESEND_API_KEY:}
    from-address: ${EMAIL_FROM:onboarding@resend.dev}
  sms:
    twilio-sid: ${TWILIO_ACCOUNT_SID:}
    twilio-secret: ${TWILIO_AUTH_TOKEN:}
    from-phone: ${TWILIO_FROM_PHONE:+18005550199}
  ai:
    openai-api-key: ${OPENAI_API_KEY:}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:pfyvtc1h}
    api-key: ${CLOUDINARY_API_KEY:864858557272116}
    upload-preset: ${CLOUDINARY_UPLOAD_PRESET:food}
  matching:
    weight-distance: 0.30
    weight-quantity: 0.20
    weight-urgency: 0.20
    weight-food-type: 0.15
    weight-capacity: 0.10
    weight-availability: 0.05
    max-radius-km: 25.0
  urgency:
    critical-minutes: 60
    high-minutes: 120
    medium-minutes: 240

logging:
  level:
    com.foodredistribution: INFO
    org.springframework.security: WARN

