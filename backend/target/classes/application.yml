server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: smart-food-redistribution
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/food_redistribution_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 604800000 # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  matching:
    weight-distance: 0.30
    weight-quantity: 0.20
    weight-urgency: 0.20
    weight-food-type: 0.15
    weight-capacity: 0.10
    weight-availability: 0.05
    max-radius-km: 25.0
  urgency:
    critical-minutes: 60
    high-minutes: 120
    medium-minutes: 240

logging:
  level:
    com.foodredistribution: INFO
    org.springframework.security: WARN
